services:
  - type: web
    name: sitiame-capitale
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    autoDeploy: true

    envVars:
      # ── App ────────────────────────────────────────────────────────────────
      - key: APP_NAME
        value: "Sitiame Capitale"
      - key: APP_ENV
        value: production
      - key: APP_KEY
        sync: false   # ← à renseigner manuellement : base64:AqCx3Ve+NnPEYb6pyFj06Pqy2mXWLMYidQIxpzUNI2g=
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://ah-xnl0.onrender.com

      # ── Base de données PostgreSQL (Neon, externe — plus de base Render native) ──
      # DATABASE_URL à renseigner manuellement dans Render > Environment avec la
      # chaîne de connexion Neon (onglet "Connect" du projet Neon, endpoint pooler
      # recommandé pour une appli web avec plusieurs workers).
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false   # ← postgresql://neondb_owner:MOT_DE_PASSE@ep-wispy-recipe-as35gq3f-pooler.c-4.eu-central-1.aws.neon.tech/neondb?sslmode=require

      # ── Session / Cache / Queue ─────────────────────────────────────────────
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_LIFETIME
        value: "120"
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local

      # ── Logs ────────────────────────────────────────────────────────────────
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_STACK
        value: stderr,single
      - key: LOG_LEVEL
        value: warning

      # ── Sécurité ─────────────────────────────────────────────────────────────
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: SESSION_SECURE_COOKIE
        value: "true"

      # ── Identifiants à renseigner manuellement dans le dashboard Render ─────
      - key: PLATFORM_ADMIN_EMAIL
        sync: false
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: CINETPAY_API_KEY
        sync: false
      - key: CINETPAY_SITE_ID
        sync: false
      - key: CINETPAY_SECRET_KEY
        sync: false
      - key: HUGGINGFACE_TOKEN
        sync: false
